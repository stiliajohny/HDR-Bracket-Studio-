name: Deploy website to GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Build website
        env:
          GITHUB_PAGES: 'true'
        run: npm run build:web
      - name: Verify GitHub Pages artifact
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, existsSync } from 'node:fs';
          import { join } from 'node:path';
          const html = readFileSync('dist/index.html', 'utf8');
          const base = '/HDR-Bracket-Studio-/';
          const assets = [...html.matchAll(/(?:src|href)="(\/HDR-Bracket-Studio-\/assets\/[^"]+)"/g)].map(m => m[1]);
          if (!assets.some(p => p.endsWith('.js'))) throw Error('index.html does not reference a bundled JS file at the correct Pages base path');
          for (const path of assets) {
            const localPath = join('dist', path.slice(base.length));
            if (!existsSync(localPath)) throw Error('Missing referenced asset: ' + localPath);
          }
          console.log('Verified index.html and', assets.length, 'GitHub Pages assets');
          NODE
      - name: Verify deployed DNG decoder assets
        run: |
          test -s dist/rawconvert/rawconvert-core.wasm
          test -s dist/rawconvert/rawconvert-core.js
          test -s dist/rawconvert/worker.js
          echo "LibRaw DNG decoder assets are included in dist"
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
